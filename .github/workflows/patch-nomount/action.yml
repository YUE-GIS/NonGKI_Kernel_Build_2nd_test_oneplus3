name: 'Patch NoMount for Kernel.'

runs:
  using: 'composite'
  steps:
      - name: Patch NoMount
        if: env.NOMOUNT_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          # oneplus3 fork: dev ships Linux 3.18 compat baked into kernel/src,
          # and its setup.sh clones this fork (not upstream). Sync upstream manually.
          curl https://raw.githubusercontent.com/YUE-GIS/nomount_test_oneplus3/refs/heads/dev/kernel/setup.sh | bash -s

          echo "CONFIG_NOMOUNT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          echo "[+] Patched NoMount for your kernel successfully."
