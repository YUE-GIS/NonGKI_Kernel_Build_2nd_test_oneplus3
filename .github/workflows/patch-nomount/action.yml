name: 'Patch NoMount for Kernel.'

# The default follows upstream. Kernels that need a patched NoMount fork
# (e.g. oneplus3 / Linux 3.18) override it via the calling workflow's `with:`.
inputs:
  setup_script_url:
    description: 'URL of NoMount kernel/setup.sh'
    required: false
    default: 'https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh'

runs:
  using: 'composite'
  steps:
      - name: Patch NoMount
        if: env.NOMOUNT_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          curl -fsSL "${{ inputs.setup_script_url }}" | bash -s

          echo "CONFIG_NOMOUNT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          echo "[+] Patched NoMount for your kernel successfully."
