name: Build OnePlus 3

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ksu_fork:
        description: "KernelSU fork to build: xxksu | rsuntk | sukisu | next | bakasu. Leave empty to use the default (xxksu)."
        required: false
        default: ""
        type: string

env:
  # ===== Device =====
  DEVICE_NAME: "oneplus_3_cn"
  DEVICE_CODENAME: "oneplus3"
  # Match the stock kernel's uname -r (scripts/setlocalversion reads .scmversion)
  KERNEL_LOCALVERSION: "-gb2a6b3b56106"
  # Match the stock kernel build identity read by scripts/mkcompile_h
  KBUILD_BUILD_TIMESTAMP: "Wed Sep 30 22:18:05 UTC 2026"
  KBUILD_BUILD_USER: "root"
  KBUILD_BUILD_HOST: "e21ccc3b0171"

  # 3.18 内核用 GCC 4.9，不用 Clang
  CUSTOM_CMDS: ""
  EXTRA_CMDS: "ARCH=arm64 SUBARCH=arm64"

  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_oneplus_msm8996.git"
  KERNEL_BRANCH: "lineage-18.1"

  CLANG_SOURCE: ""
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "lineageos_oneplus3_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # ===== KernelSU =====
  # xxksu = backslashxx 版，明确支持 3.x 内核
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  # KERNELSU_AUTO_FORK 定义在 job 级 env（见 build-kernel.job.env），
  # 这样 workflow_dispatch 的 ksu_fork 输入才能覆盖它。
  KERNELSU_METHOD: "shell"

  # 3.18 没有 CONFIG_KPROBES，用 syscall hook
  HOOK_METHOD: "syscall"

  # 第一轮先关 SUSFS，跑通 KSU 再开
  SUSFS_ENABLE: false
  SUSFS_FIXED: false
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  # ===== Packing =====
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  BOOT_SOURCE: "https://download.lineage.microg.org/oneplus3/lineage-18.1-20260930-microG-oneplus3-boot.img"

  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  ROM_TEXT: "lineage-18.1"

  PYTHON_VERSION: "3"
  # MKBOOTIMG = 云端直接用原版 boot.img 重打包，产出可 flash 的 boot.img（无需 magiskboot）
  PACK_METHOD: "MKBOOTIMG"
  PACK_KMODULES: "false"

  # ===== Optional features (全部关闭) =====
  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "true"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  # ===== Debug =====
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  FREE_MORE_SPACE: "false"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

jobs:
  build-kernel:
    name: Build OnePlus 3 Kernel
    runs-on: ubuntu-24.04
    env:
      # 分 KSU 分支编译：dispatch 时填 ksu_fork 覆盖，留空则用 xxksu。
      # 注意：换分支后 CONFIG_KSU_NOPRINTK 可能不存在（只有 xxksu 有），
      # harden_kernel.py 会告警并跳过，不会让构建失败。
      KERNELSU_AUTO_FORK: ${{ github.event.inputs.ksu_fork || 'xxksu' }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Nothing

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🏷️ Pin kernel localversion
        shell: bash
        run: |
          printf -- '%s' "$KERNEL_LOCALVERSION" > "$GITHUB_WORKSPACE/device_kernel/.scmversion"
          echo "[+] localversion pinned to: $(cat "$GITHUB_WORKSPACE/device_kernel/.scmversion")"

      - name: 🩹 NoMount 3.18 compat
        if: env.NOMOUNT_ENABLE == 'true'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          P="$GITHUB_WORKSPACE/Patches/nomount318/fix_nomount_318.py"
          [ -f "$P" ] || P="/tmp/Patches/nomount318/fix_nomount_318.py"
          python3 "$P" NoMount/kernel/src

      - name: 🔇 Harden kernel fingerprints
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          P="$GITHUB_WORKSPACE/Patches/nomount318/harden_kernel.py"
          [ -f "$P" ] || P="/tmp/Patches/nomount318/harden_kernel.py"
          python3 "$P" . "arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: 🧭 Tag artifact with KSU fork
        shell: bash
        run: |
          FORK="${{ env.KERNELSU_AUTO_FORK }}"
          echo "[.] KernelSU fork: $FORK"
          if [ -z "$PACK_NAME" ]; then
            echo "[!] PACK_NAME is empty, skip rename"
            exit 0
          fi
          EXT="${PACK_NAME##*.}"
          STEM="${PACK_NAME%.*}"
          NEW="${STEM}-KSU-${FORK}.${EXT}"
          echo "PACK_NAME=$NEW" >> "$GITHUB_ENV"
          echo "[+] artifact renamed to: $NEW"

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
