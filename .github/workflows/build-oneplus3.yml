name: Build OnePlus 3

on:
  workflow_call:
  workflow_dispatch:

env:
  # ===== Device =====
  DEVICE_NAME: "oneplus_3_cn"
  DEVICE_CODENAME: "oneplus3"

  # 3.18 内核用 GCC 4.9，不用 Clang
  CUSTOM_CMDS: ""
  EXTRA_CMDS: "ARCH=arm64 SUBARCH=arm64"

  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_oneplus_msm8996.git"
  KERNEL_BRANCH: "lineage-18.1"

  CLANG_SOURCE: ""
  CLANG_BRANCH: ""

  GCC_GNU: false
  GCC_64_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "lineage-19.1"
  GCC_32_SOURCE: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "lineage-19.1"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "lineageos_oneplus3_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # ===== KernelSU =====
  # xxksu = backslashxx 版，明确支持 3.x 内核
  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "xxksu"
  KERNELSU_METHOD: "shell"

  # 3.18 没有 CONFIG_KPROBES，用 syscall hook
  HOOK_METHOD: "syscall"

  # 第一轮先关 SUSFS，跑通 KSU 再开
  SUSFS_ENABLE: false
  SUSFS_FIXED: false
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  # ===== Packing =====
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  BOOT_SOURCE: "https://download.lineage.microg.org/oneplus3/lineage-18.1-20260930-microG-oneplus3-boot.img"

  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  ROM_TEXT: "lineage-18.1"

  PYTHON_VERSION: "3"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  # ===== Optional features (全部关闭) =====
  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "true"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  # ===== Debug =====
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  FREE_MORE_SPACE: "false"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

jobs:
  build-kernel:
    name: Build OnePlus 3 Kernel
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Nothing

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🩹 NoMount 3.18 compat
        if: env.NOMOUNT_ENABLE == 'true'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          P="$GITHUB_WORKSPACE/Patches/nomount318/fix_nomount_318.py"
          [ -f "$P" ] || P="/tmp/Patches/nomount318/fix_nomount_318.py"
          python3 "$P" NoMount/kernel/src

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
